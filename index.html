<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12122a">
<meta name="color-scheme" content="light">
<script>try{var _t=localStorage.getItem('stl-theme');document.documentElement.setAttribute('data-theme',_t||'arcade')}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="São Thomé">
<title>Guia São Thomé</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
@font-face{font-family:'Caveat';font-weight:600;font-display:swap;src:url(fonts/caveat.woff2) format('woff2')}
@font-face{font-family:'Press Start 2P';font-weight:400;font-display:swap;src:url(fonts/pressstart.woff2) format('woff2')}
@font-face{font-family:'VT323';font-weight:400;font-display:swap;src:url(fonts/vt323.woff2) format('woff2')}
@font-face{font-family:'Bangers';font-weight:400;font-display:swap;src:url(fonts/bangers.woff2) format('woff2')}
@font-face{font-family:'Comic Neue';font-weight:400 700;font-display:swap;src:url(fonts/comicneue.woff2) format('woff2')}
@font-face{font-family:'Special Elite';font-weight:400;font-display:swap;src:url(fonts/specialelite.woff2) format('woff2')}
:root{color-scheme:light;--paper:#efe6d3;--paper2:#f6efe0;--ink:#2a2420;--mut:#6b5f55;--stone:#c9a9a0;--ocre:#b8782f;--fog:#6f8a9a;--neon:#ff3d8b;--moss:#4f6b3a;--stamp:#b3261e;
--type:'Special Elite','Courier New',monospace;--hand:'Caveat','Segoe Print','Bradley Hand',cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.45 var(--type)}
body{background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:5px 5px}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{padding:10px 16px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kicker{font:600 20px/1 var(--hand);color:var(--neon);transform:rotate(-2deg);display:block}
header h1{font:400 24px/1.1 var(--type);margin:2px 0 0;letter-spacing:-.5px}
#count{font:600 17px var(--hand);color:var(--mut);white-space:nowrap}
.top-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#loc{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:9px 12px;font:13px var(--type);min-height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:0 12px;min-height:40px;font:13px var(--type);border-radius:255px 12px 225px 12px/12px 225px 12px 255px}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--ink);color:var(--paper)}
#mapwrap{flex:0 0 42%;min-height:210px;margin:0 12px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);position:relative}
#map{position:absolute;inset:0;background:#e0d6c0}
.tiles{filter:sepia(.55) saturate(.75) contrast(.95) brightness(1.03)}
.leaflet-container{font-family:var(--type)}
#list{flex:1;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.page{position:relative;background:var(--paper2);border:1.5px solid var(--ink);padding:12px 14px;margin-bottom:14px;box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r,0deg));border-radius:2px 14px 3px 10px;min-height:56px}
.page .t{display:flex;align-items:center;gap:10px;font-size:16px}
.page .t svg{flex:none;width:26px;height:26px;color:var(--c)}
.page .t b{font-weight:400;flex:1}
.page .s{color:var(--mut);font-size:13px;margin:3px 0 0 36px}
.dist{font:600 18px var(--hand);color:var(--ocre);white-space:nowrap}
.road{display:inline-block;margin-left:6px;border:1.5px solid var(--stamp);color:var(--stamp);font-size:11px;padding:0 5px;transform:rotate(-3deg)}
.mini{font:600 18px var(--hand);color:var(--stamp);border:2px solid var(--stamp);padding:0 7px;transform:rotate(-6deg)}
.mini.q{color:var(--ocre);border-color:var(--ocre)}
.tag{width:34px;height:34px;background:var(--paper2);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--c);display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);border-radius:2px 8px 2px 8px}
.tag svg{width:22px;height:22px}
.tag.done{background:#e8c8c4;color:var(--stamp)}
.tag.want{outline:2px dashed var(--ocre);outline-offset:2px}
.me{position:relative;width:22px;height:22px;border-radius:50%;background:var(--neon);border:4px solid #fff;box-shadow:0 0 0 2px #111,0 2px 6px #0007}
.me::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--neon);opacity:0;animation:pulso 1.8s ease-out infinite}
.me i{position:absolute;left:28px;top:-3px;background:#111;color:#fff;font:700 12px var(--type);font-style:normal;padding:2px 6px;border-radius:8px;white-space:nowrap}
@keyframes pulso{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.me::after{animation:none;opacity:.5;inset:-8px}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;overflow-y:auto;background:var(--paper2);border-top:2px solid var(--ink);box-shadow:0 -4px 0 var(--ink);padding:18px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(106%);transition:transform .25s;z-index:1000;background-image:repeating-linear-gradient(transparent 0 27px,#2a24201a 27px 28px)}
#sheet.open{transform:none}
#sheet h2{font:400 22px/1.15 var(--type);margin:0 44px 2px 0}
#sheet .x{position:absolute;right:12px;top:12px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);width:40px;height:40px;font-size:18px;border-radius:50%}
.meta{color:var(--mut);font-size:13px;margin-bottom:10px}
.stamp{position:absolute;right:62px;top:14px;font:600 24px/1 var(--hand);color:var(--stamp);border:3px solid var(--stamp);padding:4px 10px;transform:rotate(-9deg);opacity:.85;text-align:center}
.stamp small{display:block;font:12px var(--type)}
h3{font:600 20px var(--hand);margin:14px 0 2px}
h3.ok{color:var(--moss)}h3.no{color:var(--stamp)}h3.how{color:var(--fog)}h3.lore{color:#8e6aa8}h3.nota{color:var(--neon)}
ul{margin:0;padding-left:20px}li{margin:3px 0}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:14px var(--type);text-decoration:none;border-radius:2px 12px 2px 12px;box-shadow:2px 2px 0 var(--ink)}
.btn.go{background:var(--ink);color:var(--paper)}
.btn.on{background:var(--ocre);color:var(--paper)}
.btn.fui.on{background:var(--stamp)}
textarea{width:100%;min-height:70px;background:transparent;border:1.5px dashed var(--ink);padding:8px;font:600 19px/1.2 var(--hand);color:var(--ink);resize:vertical}
.note{color:var(--mut);font-size:12px;margin-top:12px}
.tips{transform:rotate(.4deg)}
/* ---- v3: cor, fichas, mapa ---- */
#me{position:absolute;right:10px;top:104px;z-index:500;width:44px;height:44px;padding:0;border:2px solid var(--ink);background:var(--neon);color:#fff;box-shadow:2px 2px 0 var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
#me svg{width:26px;height:26px}
#me.busy{opacity:.6}
.hbtns{display:flex;gap:6px;align-items:center}
#loc{white-space:nowrap;padding:9px 10px}
header>div:first-child{min-width:0}
#toast{top:140px!important}
#theme{min-width:40px;min-height:40px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
#help{min-width:40px;min-height:40px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);font:700 18px var(--type);border-radius:50%;padding:0}
.tag.home{--c:var(--neon);background:#ffd9e8}
.tempo{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.tempo span{border:1.5px dashed var(--ink);padding:4px 8px;font-size:13px;background:var(--paper)}
.chip{font-size:14px}
.chip.on{background:var(--c);color:#fff}
.chip.on svg{color:#fff}
.prog{height:8px;margin:0 16px 2px;border:1.5px solid var(--ink);background:var(--paper2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(135deg,var(--neon) 0 8px,var(--ocre) 8px 16px,var(--fog) 16px 24px);transition:width .4s}
.page{background:color-mix(in srgb,var(--c) 14%,var(--paper2));padding-left:16px;margin-top:6px}
.page::before{content:"";position:absolute;left:16px;top:-9px;width:56px;height:16px;background:var(--c);opacity:.6;transform:rotate(-4deg)}
.page.tips{--c:var(--neon)}
header h1{background:linear-gradient(transparent 62%,#ff3d8b44 62%);display:inline}
#sheet{top:48px;max-height:none;border-top:8px solid var(--c,var(--ink));box-shadow:none}
#sheet h2{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--c) 45%,transparent) 58%);display:inline}
#sheet .btn.go{background:var(--c,var(--ink));border-color:var(--ink);color:#fff}
#peek{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--c,#888) 14%,var(--paper2));border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:12px 14px;z-index:900;transform:translateY(160%);transition:transform .2s}
#peek.open{transform:none}
#peek .t{display:flex;align-items:center;gap:10px;font-size:17px;margin-right:40px}
#peek .t svg{width:26px;height:26px;color:var(--c)}
#peek .s{color:var(--mut);font-size:13px;margin:2px 0 0 36px}
#peek .x{position:absolute;right:8px;top:8px;background:transparent;border:1.5px solid var(--ink);width:40px;height:40px;border-radius:50%;font-size:16px;color:var(--ink)}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);background:var(--ink);color:var(--paper);padding:10px 16px;font:600 20px var(--hand);z-index:2000;opacity:0;transition:.25s;pointer-events:none;border-radius:2px 12px 2px 12px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.mapbtns{position:absolute;left:8px;top:8px;z-index:500;display:flex;gap:6px}
.mapbtns button{min-height:40px;padding:0 12px;border:2px solid var(--ink);background:var(--paper2);color:var(--ink);font:13px var(--type);box-shadow:2px 2px 0 var(--ink);border-radius:2px 10px 2px 10px}
.mc{width:38px;height:38px;border-radius:50%;background:var(--neon);color:#fff;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font:700 15px var(--type)}
.leaflet-bar{border:2px solid var(--ink)!important;box-shadow:2px 2px 0 var(--ink)!important}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;font-size:22px!important;background:var(--paper2)!important;color:var(--ink)!important}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
@media (max-height:700px) and (orientation:portrait){
 header h1{font-size:20px}.kicker{font-size:17px}
 .chips{padding-top:4px;padding-bottom:6px}.chip{min-height:38px}
 #mapwrap{flex-basis:32%;min-height:170px}
}
@media (orientation:landscape) and (max-height:520px){
 #app{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(0,1fr)}
 header,.chips,.prog{grid-column:1/3}
 #mapwrap{grid-column:1;grid-row:4;flex:none;min-height:0;margin-bottom:10px}
 #list{grid-column:2;grid-row:4}
 #sheet{top:0}
}
/* ====== TEMA GIBI (alternativo): traço grosso, pontinhos de impressão, cores fortes, balões ====== */
html[data-theme=gibi]{--paper:#fff3c4;--paper2:#ffffff;--ink:#111;--mut:#3b3b3b;--ocre:#0b5cd5;--fog:#0b5cd5;--neon:#e62429;--moss:#12873a;--stamp:#e62429;--hand:'Bangers','Impact',cursive;--type:'Comic Neue','Comic Sans MS',sans-serif}
html[data-theme=gibi] body{background-color:#fff3c4;background-image:radial-gradient(#e6242933 1.4px,transparent 1.7px);background-size:9px 9px}
html[data-theme=gibi] .kicker{background:#ffd400;color:#111;border:2px solid #111;padding:2px 8px;font-size:15px;letter-spacing:.5px;display:inline-block;box-shadow:2px 2px 0 #111;transform:rotate(-2deg)}
html[data-theme=gibi] header h1{font:400 30px/1.2 var(--hand);color:#ffd400;-webkit-text-stroke:1.5px #111;paint-order:stroke fill;text-shadow:3px 3px 0 #111;letter-spacing:1px;background:none;margin-top:8px}
html[data-theme=gibi] #count{color:#111;font-size:19px;letter-spacing:.5px}
html[data-theme=gibi] .prog{border-width:3px;height:12px;border-radius:0}
html[data-theme=gibi] .prog i{background:repeating-linear-gradient(135deg,#e62429 0 8px,#ffd400 8px 16px,#0b5cd5 16px 24px)}
html[data-theme=gibi] #loc{background:#e62429;color:#fff;border:3px solid #111;border-radius:0;font:400 17px var(--hand);letter-spacing:.5px;box-shadow:3px 3px 0 #111;transform:skew(-6deg)}
html[data-theme=gibi] #help,html[data-theme=gibi] #theme{border:3px solid #111;background:#ffd400;color:#111;box-shadow:2px 2px 0 #111;font-family:var(--hand)}
html[data-theme=gibi] .chip{border:3px solid #111;border-radius:0;transform:skew(-6deg);font:400 16px var(--hand);letter-spacing:.5px;background:#fff;box-shadow:2px 2px 0 #111}
html[data-theme=gibi] .chip.on{background:var(--c);color:#fff}
html[data-theme=gibi] #mapwrap{border:4px solid #111;box-shadow:5px 5px 0 #111;border-radius:0}
html[data-theme=gibi] .tiles{filter:saturate(1.5) contrast(1.1) brightness(1.02)}
html[data-theme=gibi] #mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background-image:radial-gradient(#00000022 1.1px,transparent 1.3px);background-size:6px 6px}
html[data-theme=gibi] .page{background-color:#fff;background-image:radial-gradient(color-mix(in srgb,var(--c) 45%,transparent) 1.3px,transparent 1.6px);background-size:7px 7px;border:3px solid #111;border-radius:0;box-shadow:5px 5px 0 #111;padding-left:24px;transform:rotate(var(--r,0deg)) skew(-1deg)}
html[data-theme=gibi] .page::before{left:0;top:0;bottom:0;width:12px;height:auto;transform:none;opacity:1;background:var(--c);border-right:3px solid #111}
html[data-theme=gibi] .page .t{font-size:17px;font-weight:700}
html[data-theme=gibi] .page .t b{font-family:var(--hand);font-weight:400;font-size:22px;letter-spacing:.5px}
html[data-theme=gibi] .page .s{font-weight:700}
html[data-theme=gibi] .page.tips{--c:#ffd400}
html[data-theme=gibi] .dist{color:#0b5cd5;font-size:22px}
html[data-theme=gibi] .mini{background:#ffd400;color:#e62429;border:3px solid #111;font-size:18px}
html[data-theme=gibi] .mini.q{background:#0b5cd5;color:#fff}
html[data-theme=gibi] .road{background:#e62429;color:#fff;border-color:#111}
html[data-theme=gibi] .tag{background:var(--c);color:#fff;border:3px solid #111;box-shadow:3px 3px 0 #111;border-radius:0;transform:skew(-6deg)}
html[data-theme=gibi] .tag.done{background:#ffd400;color:#e62429}
html[data-theme=gibi] .tag.want{outline:3px dashed #0b5cd5}
html[data-theme=gibi] .tag.home{background:#e62429;color:#fff}
html[data-theme=gibi] .mc{background:#ffd400;color:#111;border:3px solid #111;font-family:var(--hand);font-size:19px;box-shadow:3px 3px 0 #111}
html[data-theme=gibi] #sheet{background-color:#fffbea;background-image:radial-gradient(#0b5cd522 1.3px,transparent 1.6px);background-size:8px 8px;border-top:8px solid var(--c,#111);box-shadow:0 -4px 0 #111}
html[data-theme=gibi] #sheet h2{font:400 30px/1.05 var(--hand);letter-spacing:1px;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c) 55%,transparent) 62%)}
html[data-theme=gibi] #sheet .x{border:3px solid #111;background:#ffd400}
html[data-theme=gibi] h3{font-size:22px;letter-spacing:.5px}
html[data-theme=gibi] .meta,html[data-theme=gibi] .note{font-weight:700}
html[data-theme=gibi] .stamp{font:400 26px/1 var(--hand);background:#ffd400;color:#e62429;border:4px solid #111;box-shadow:4px 4px 0 #111;transform:rotate(-7deg);opacity:1;padding:6px 10px}
html[data-theme=gibi] .btn{border:3px solid #111;border-radius:0;font:400 19px var(--hand);letter-spacing:.5px;box-shadow:3px 3px 0 #111;background:#fff;transform:skew(-4deg)}
html[data-theme=gibi] #sheet .btn.go,html[data-theme=gibi] #peek .btn.go{background:var(--c);color:#fff}
html[data-theme=gibi] .btn.on{background:#0b5cd5;color:#fff}
html[data-theme=gibi] .btn.fui.on{background:#e62429}
html[data-theme=gibi] .tempo span{border:2px solid #111;background:#ffd400;color:#111;font-weight:700;transform:rotate(-1deg)}
html[data-theme=gibi] textarea{font:700 16px/1.3 var(--type);border:3px solid #111;background:#fff}
html[data-theme=gibi] #peek{border:3px solid #111;border-radius:0;box-shadow:5px 5px 0 #111;background:#fff}
html[data-theme=gibi] #peek .t{font-family:var(--hand);font-size:22px}
html[data-theme=gibi] #peek .x{border:3px solid #111;background:#ffd400}
html[data-theme=gibi] #toast{background:#fff;color:#111;border:3px solid #111;border-radius:22px;font:400 21px var(--hand);letter-spacing:.5px;box-shadow:3px 3px 0 #111}
html[data-theme=gibi] #me{background:#e62429;border:3px solid #111;box-shadow:3px 3px 0 #111}
html[data-theme=gibi] .mapbtns button{border:3px solid #111;border-radius:0;font:400 17px var(--hand);background:#ffd400;transform:skew(-6deg)}
html[data-theme=gibi] .leaflet-bar a{border-radius:0!important;background:#fff!important}
@media (max-width:420px){
 html[data-theme=gibi] header{flex-wrap:wrap;align-items:flex-start;gap:6px}
 html[data-theme=gibi] header>div:first-child{flex:1 1 100%}
 html[data-theme=gibi] .top-r{flex:1 1 100%;flex-direction:row;justify-content:space-between;align-items:center}
 html[data-theme=gibi] #count{white-space:normal;font-size:17px;line-height:1.05;flex:1 1 auto;min-width:0}
 html[data-theme=gibi] .hbtns{flex:none}
 html[data-theme=gibi] .kicker{font-size:13px;max-width:100%}
 html[data-theme=gibi] header h1{font-size:26px;margin-top:6px}
 html[data-theme=gibi] #loc{font-size:15px;padding:9px 8px}
}
/* ---- v4: mapa maior e filtros mais espaçados (todos os visuais) ---- */
.prog{margin:10px 16px 6px}
header{padding-bottom:6px}
.chips{gap:14px;padding:14px 18px 22px}
.chip{min-height:44px;padding:0 14px}
#mapwrap{flex-basis:52%;min-height:270px;margin-bottom:6px}
@media (max-height:700px) and (orientation:portrait){
 #mapwrap{flex-basis:44%;min-height:220px}
 .chips{gap:12px;padding:10px 18px 16px}
 .prog{margin-top:8px}
}
@media (max-height:640px) and (orientation:portrait){
 #mapwrap{flex-basis:38%;min-height:190px}
}
@media (orientation:landscape) and (max-height:520px){
 #mapwrap{min-height:0;flex-basis:auto;margin-bottom:10px}
 .chips{gap:10px;padding:6px 18px 8px}.chip{min-height:38px}
}
/* ====== TEMA ARCADE (alternativo): videogame pixel, HUD, fases e pontuação ====== */
html[data-theme=arcade]{--paper:#12122a;--paper2:#22224a;--ink:#ffffff;--mut:#b9b9e8;--ocre:#ffe14d;--fog:#25e0ff;--neon:#ff4d8d;--moss:#6bff6b;--stamp:#ff4d8d;--hand:'Press Start 2P','Courier New',monospace;--type:'VT323','Courier New',monospace}
html[data-theme=arcade] body{background-color:#12122a;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:16px 16px;font-size:20px;line-height:1.15;color:#fff}
html[data-theme=arcade] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3000;background:repeating-linear-gradient(transparent 0 2px,#00000022 2px 3px)}
html[data-theme=arcade] .kicker{background:#ff4d8d;color:#000;border:3px solid #fff;padding:3px 6px;font:400 8px/1.4 var(--hand);display:inline-block;transform:none;box-shadow:3px 3px 0 #000}

function km(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);
 const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const dist=p=>p.ll?km(pos||CHALE,p.ll):null;
const AP=()=>THEME==="arcade"?"±":"~";
const from=()=>pos?"de você":"do chalé";
function eta(p){if(!p.ll)return p.m?{m:p.m,mode:"de carro",ref:"do centro"}:null;const d=dist(p);
 if(d<1.2)return{m:Math.max(2,Math.round(d*13)),mode:"a pé",ref:from()};
 const v=BAD.includes(p.id)?28:35;return{m:Math.max(5,Math.round(d*1.5/v*12)*5),mode:"de carro",ref:from()}}
function tempoShort(p){const e=eta(p);return (e?" · "+AP()+e.m+" min "+e.mode:"")+(p.t?" · visita "+AP()+p.t:"")}
function tempoBlock(p){const e=eta(p);return `<div class="tempo">${e?`<span>${tx().go}: ${AP()}${e.m} min ${e.mode} (${e.ref})</span>`:""}${p.t?`<span>${tx().visit}: ${AP()}${esc(p.t)}</span>`:""}</div>`}
const fmt=k=>k<1?Math.round(k*1000)+" m":k.toFixed(1).replace(".",",")+" km";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st=id=>status[id]&&status[id].s;

function icon(p){const s=st(p.id);
 return L.divIcon({className:"",html:`<div class="tag ${s==="fui"?"done":s==="quero"?"want":""}" style="--c:${COL[p.c]}">${svg(p.c)}</div>`,iconSize:[34,34],iconAnchor:[17,30]})}

function count(){const n=Object.values(status).filter(v=>v.s==="fui").length;document.getElementById("count").textContent=tx().count(n,P.length);document.getElementById("progbar").style.width=(100*n/P.length)+"%"}

function peek(id){const p=P.find(x=>x.id===id),el=document.getElementById("peek");
 el.style.setProperty("--c",COL[p.c]);
 el.innerHTML=`<button class="x" onclick="closePeek()" aria-label="Fechar">✕</button><div class="t">${svg(p.c)}<b>${esc(p.n)}</b></div><div class="s">${esc(p.d)}${tempoShort(p)}</div><div class="btns"><button class="btn go" style="background:var(--c);color:#fff" onclick="openSheet('${id}')">Detalhes</button><a class="btn" target="_blank" rel="noopener" href="${gmaps(p)}">Como chegar</a></div>`;
 el.classList.add("open");map.setView(p.ll,Math.max(map.getZoom(),15))}
map.on("click",closePeek);

function render(){
 const items=P.filter(p=>cat==="all"||p.c===cat).sort((a,b)=>pos?(dist(a)??1e9)-(dist(b)??1e9):0);
 cluster.clearLayers();
 items.filter(p=>p.ll).forEach(p=>cluster.addLayer(L.marker(p.ll,{icon:icon(p)}).on("click",()=>peek(p.id))));
 document.getElementById("list").innerHTML=items.map((p,i)=>{const s=st(p.id);
  const right=s==="fui"?`<span class="mini">${tx().miniDone}</span>`:s==="quero"?`<span class="mini q">${tx().miniWant}</span>`:p.ll?`<span class="dist">${fmt(dist(p))}</span>`:"";
  return `<div class="page" style="--r:${i%2?.5:-.5}deg;--c:${COL[p.c]}" onclick="openSheet('${p.id}')"><div class="t">${svg(p.c)}<b>${esc(p.n)}</b>${right}</div>
  <div class="s">${esc(p.d)}${tempoShort(p)}${p.r?" · ★ "+p.r:""}${p.p?" · "+p.p:""}${BAD.includes(p.id)?'<span class="road">estrada de terra</span>':""}</div></div>`}).join("")
  +`<div class="page tips"><div class="t"><b>${tx().tips}</b></div><ul style="margin-top:6px">${TIPS.map(t=>`<li>${t.replace(/^\S+\s/,"")}</li>`).join("")}</ul></div>`;
 count();
}

let watching=false,lt;
addEventListener("offline",()=>toast("Sem internet: o mapa pode ficar incompleto, mas a lista e as fichas funcionam."));
addEventListener("online",()=>toast("Internet de volta"));
function locate(auto){
 const b=document.getElementById("loc");
 if(!navigator.geolocation){if(!auto)toast("Seu navegador não tem localização.");return}
 b.textContent="Buscando...";
 clearTimeout(lt);lt=setTimeout(()=>{if(b.textContent==="Buscando...")b.textContent=pos?"Atualizar local":"Perto de mim"},12000);
 navigator.geolocation.getCurrentPosition(g=>{
  pos=[g.coords.latitude,g.coords.longitude];meMarker.setLatLng(pos).addTo(map);
  if(km(pos,CENTER)>30){toast("Você está a "+Math.round(km(pos,CENTER))+" km de São Thomé. Mostrando a cidade.");map.setView(CENTER,15)}
  else map.setView(pos,16);
  b.textContent="Atualizar local";render();
  if(!watching){watching=true;navigator.geolocation.watchPosition(w=>{const n=[w.coords.latitude,w.coords.longitude];
   if(pos&&km(n,pos)>.08){pos=n;meMarker.setLatLng(pos);render()}},()=>{},{enableHighAccuracy:true,maximumAge:15000})}},
 err=>{b.textContent="Perto de mim";toast(err&&err.code===1?"Localização bloqueada. Toque no ? para ver como liberar.":"Não consegui sua localização. Vá para céu aberto e toque em Perto de mim.")},
 {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}

 if(pos){meMarker.setLatLng(pos).addTo(map);map.setView(pos,Math.max(map.getZoom(),16))}
 b.classList.add("busy");
 navigator.geolocation.getCurrentPosition(g=>{
  b.classList.remove("busy");pos=[g.coords.latitude,g.coords.longitude];meMarker.setLatLng(pos).addTo(map);
  map.setView(pos,Math.max(map.getZoom(),16));document.getElementById("loc").textContent="Atualizar local";render();
  if(km(pos,CENTER)>30)toast("Você está a "+Math.round(km(pos,CENTER))+" km de São Thomé.")},
 err=>{b.classList.remove("busy");toast(err&&err.code===1?"Localização bloqueada. Toque no ? para ver como liberar.":"Não consegui sua localização. Vá para céu aberto e tente de novo.")},
 {enableHighAccuracy:true,timeout:15000,maximumAge:10000});
};
